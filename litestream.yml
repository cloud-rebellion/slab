# Litestream config for Atomic Site (Phase 30.4, 2026-05-06).
#
# Continuously streams the SQLite WAL of /app/data/atomicsite.db to a
# Hetzner Object Storage bucket. Sub-1-second RPO: a host failure
# loses at most ~1 second of writes. Replication is per-WAL-segment
# (~10s default snapshot interval, with finer-grained writes in
# between).
#
# All replica targets are EU-sovereign. The default replica is
# Hetzner Object Storage (Falkenstein); operators can swap in any
# S3-compatible endpoint via the LITESTREAM_REPLICA_URL env (used
# below as the only template variable so this file stays static
# across deploys).
#
# To run as a sidecar process inside the existing atomicsite
# container, the entrypoint wraps the server with:
#
#   exec litestream replicate -exec "/app/server"
#
# Litestream then forwards SIGTERM to the server on shutdown so a
# `docker stop` flushes the final WAL frames before the container
# dies.
#
# Restore (one-shot, manual):
#
#   litestream restore -o /app/data/atomicsite.db \
#     "${LITESTREAM_REPLICA_URL}"
#
# Run from a fresh container with the same env. The DB file appears
# at the target path with all data through the last replicated frame.
#
# Local dev: leave LITESTREAM_REPLICA_URL unset and the server starts
# without litestream wrapping (the entrypoint detects the empty var
# and execs the server directly). No replication, no cost.

# Ported to the litestream 0.5 config model (2026-08-11, with the 0.3.13 ->
# 0.5.16 bump in the Dockerfile).
#
# 0.5 renamed all of these keys AND its parser ignores unknown ones silently,
# so leaving the 0.3 spellings in place would have produced a file that still
# looked like a retention policy and enforced nothing. Verified by running
# 0.5.16 against a local file replica and reading back the monitors it
# actually starts.
#
#   0.3 snapshot-interval: 6h        -> snapshot.interval  (level 9 compaction)
#   0.3 retention: 720h              -> snapshot.retention
#   0.3 retention-check-interval:24h -> l0-retention-check-interval
#   0.3 validation-interval: 1h      -> validation.{enabled,interval}
#   0.3 dbs[].replicas[]             -> dbs[].replica (plural is deprecated)

# Snapshot every 6 hours (4/day). Writes stream continuously as LTX files;
# snapshots are the GC point so the bucket does not grow unbounded.
snapshot:
  interval: 6h
  # Keep snapshots for 30 days, the GDPR-friendly default. Operators can
  # extend it.
  retention: 720h

# Validate the replica every hour so a silent S3 outage surfaces in the logs
# before the next restore, rather than at the restore.
validation:
  enabled: true
  interval: 1h

# How often the short-lived L0 files are swept.
l0-retention-check-interval: 24h

dbs:
  - path: /app/data/atomicsite.db
    replica:
      url: ${LITESTREAM_REPLICA_URL}
