# Atomic Site: OSS reference Docker Compose
#
# This file is the OSS-friendly example. It expects you to run from the
# atomicsite/ directory only (no parent-context coupling to a sibling
# CookieProof checkout). The CookieProof widget is already embedded into
# the binary at compile time, so no extra build context is needed.
#
# Bright Interaction's production deployment uses docker-compose.yml in
# this same directory, which is wired for the BI multi-tenant edge with
# host bind-mounts to /srv/atomicsite and /var/log/atomicsite. Don't
# copy that file for self-host; copy this one.
#
# Quickstart:
#   cp .env.example .env       # fill in JWT_SECRET, ANALYTICS_SALT,
#                              # ATOMICSITE_PRIMARY_DOMAIN, ADMIN_PASSWORD
#   docker compose -f docker-compose.example.yml up --build

services:
  atomicsite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atomicsite
    restart: unless-stopped
    ports:
      # Public on the host. Put a TLS-terminating proxy (Caddy, nginx,
      # Traefik) in front for production.
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Deployment posture. Absent means production, so a self-host that
      # forgets this line still gets every boot guard. Set
      # ATOMICSITE_ENV=development in .env only while working locally.
      ATOMICSITE_ENV: ${ATOMICSITE_ENV:-production}
      # BASE_URL guarded rather than merely supplied. env_file hands the
      # value over when it is present and says nothing when it is absent,
      # and the absent case is the dangerous one: BASE_URL falls back to
      # http://localhost:8080, which is not HTTPS. `${VAR:?message}` makes
      # `docker compose up` refuse instead. Compose interpolation reads the
      # project-directory .env, the same file this service loads through
      # env_file, so one line satisfies both and the guard costs nothing.
      # Verify by ablation: delete the line from a COPY of .env and confirm
      # `docker compose config` refuses.
      BASE_URL: "${BASE_URL:?BASE_URL must be set in .env, for example https://cms.example.com. An absent value falls back to http://localhost:8080, which is not HTTPS, and the server then refuses to start in production.}"
      PORT: "8080"
      DATA_DIR: /data
      ATOMICSITE_DEPLOYMENT_MODE: single
    volumes:
      # SQLite database, uploaded media, self-hosted woff2 fonts.
      - atomicsite-data:/data
      # Built-site dist output. Mount this to whatever path your edge
      # serves from. Defaults to a named volume so first run "just works".
      - atomicsite-dist:/srv/atomicsite
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  atomicsite-data:
  atomicsite-dist:
