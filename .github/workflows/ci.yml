# CI for the public fair-code repo.
#
# THIS FILE IS DELIBERATELY THIN. Every actual check lives in scripts/ci.sh, which you
# can run yourself:
#
#   bash scripts/ci.sh
#
# Two reasons for the split. A contributor can reproduce CI locally instead of
# discovering a failure after pushing. And this repository is a filtered mirror
# published by a job that authenticates with a repository deploy key, which GitHub does
# not permit to create or update anything under .github/workflows/. Keeping the steps
# out of this file means a change to a check no longer breaks the publish at its final
# push, after every gate has already passed.
#
# So: edit scripts/ci.sh freely. Editing THIS file is a rare, deliberate act (an action
# version bump, a trigger change) and needs a push from a credential holding the
# `workflow` scope.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      context: ${{ steps.scope.outputs.context }}
      root: ${{ steps.scope.outputs.root }}
      go_mod: ${{ steps.scope.outputs.go_mod }}
      go_sum: ${{ steps.scope.outputs.go_sum }}
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e: ${{ steps.scope.outputs.e2e }}
      ee_applicable: ${{ steps.scope.outputs.ee_applicable }}
      go_matrix: ${{ steps.scope.outputs.go_matrix }}
      ee_reason: ${{ steps.scope.outputs.ee_reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove source context and keep the original build lanes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          private=atomicsite/scripts/ci-context.py
          public=scripts/ci-context.py
          if [[ ( -e "$private" || -L "$private" ) && ( -e "$public" || -L "$public" ) ]]; then
            echo 'Ambiguous Slab CI context scripts' >&2
            exit 1
          elif [[ -f "$private" && ! -L "$private" ]]; then
            script="$private"
          elif [[ -f "$public" && ! -L "$public" ]]; then
            script="$public"
          else
            echo 'Missing regular Slab CI context script' >&2
            exit 1
          fi
          python3 "$(dirname "$script")/test_ci_context.py"
          python3 "$script" --workspace "$GITHUB_WORKSPACE" --github-output "$GITHUB_OUTPUT"

  build-test:
    needs: [layout]
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ needs.layout.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads full history, not just the tip

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ needs.layout.outputs.go_mod }}
          cache: true
          cache-dependency-path: ${{ needs.layout.outputs.go_sum }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: All checks (build, vet, gofmt, tests, frontend, secrets, vulnerabilities)
        working-directory: ${{ needs.layout.outputs.root }}
        run: bash scripts/ci.sh
